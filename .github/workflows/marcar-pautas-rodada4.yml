name: Marcar pautas rodada 4

on:
  push:
    paths:
      - 'scripts/marcar-pautas-rodada4.mjs'
      - '.github/workflows/marcar-pautas-rodada4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  marcar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Atualizar pautas
        run: node scripts/marcar-pautas-rodada4.mjs
      - name: Publicar atualização
        shell: bash
        run: |
          if git diff --quiet -- pautas.json; then
            echo "Pautas já marcadas."
            exit 0
          fi
          git config user.name "Notícia ES Editorial"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pautas.json
          git commit -m "pautas: marca quarta rodada como publicada"
          git pull --rebase
          git push
