name: Saneamento de lote curto

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/quarentenar-lote-curto.mjs'
      - '.github/workflows/quarentena-lote-curto.yml'

permissions:
  contents: write

concurrency:
  group: saneamento-lote-curto-noticia-es
  cancel-in-progress: false

jobs:
  sanear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retirar lote curto do ar e reabrir pautas
        run: node scripts/quarentenar-lote-curto.mjs
      - name: Publicar saneamento
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A auto-manifest.js pautas.json m/ quarentena/
          if git diff --cached --quiet; then
            echo "Nenhuma correção necessária."
            exit 0
          fi
          git commit -m "redacao: remove lote curto e reabre pautas"
          for tentativa in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((tentativa * 2))
          done
          exit 1
