name: Publicar capa IBGE temporário

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publicar-imagem-ibge-temp.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar capa e publicar no repositório
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/og
          curl -fL --retry 3 --retry-delay 2 \
            'https://media.canva.com/v2/document-image/hash:403547857/height:335/id:DAHVGvt7e00/type:B/width:595?brand=BAHQafnu5C4&csig=AAAAAAAAAAAAAAAAAAAAAFQndhJZiDiREQlsckQWFIg91f-6lDQIzrgFhWQ0wnQQ&disableexport=T&exp=1789331754&fallback=https%3A%2F%2Fs3.eu-central-1.amazonaws.com%2Fdocument-export.eu1.canva.com%2Ft7e00%2FDAHVGvt7e00%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHU5AHQZHS%252F20260913%252Feu-central-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260913T173259Z%26X-Amz-Expires%3D13675%26X-Amz-Signature%3Dac5fb24db683bf72e8c802f9cbabb1a72af9ac80afc5ca4d50a9104548ecb177%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DSun%252C%252013%2520Sep%25202026%252021%253A20%253A54%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAB9a_uzH7WLaSVAjx67gaCq8ii49Z0eK3fa46AwW9Kah&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1' \
            -o 'assets/og/nem-o-ibge-acredita-no-ibge.jpg'
          file 'assets/og/nem-o-ibge-acredita-no-ibge.jpg'

      - name: Commitar capa e remover workflow temporário
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og/nem-o-ibge-acredita-no-ibge.jpg
          git rm .github/workflows/publicar-imagem-ibge-temp.yml
          git commit -m "assets: publica capa da matéria do IBGE"
          git pull --rebase -X theirs origin main
          git push origin main
