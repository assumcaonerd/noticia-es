name: Preparar lote da redação automática

on:
  schedule:
    - cron: '10,40 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'pautas.json'
      - 'noticias.js'
      - 'editorial*.js'
      - 'auto-redacao-*.js'
      - 'auto-manifest.js'
      - 'opiniao.js'
      - 'fe-sociedade.js'
      - 'scripts/preparar-lote-redacao.mjs'
      - '.github/workflows/preparar-lote-redacao.yml'

permissions:
  contents: write

concurrency:
  group: preparar-lote-redacao
  cancel-in-progress: true

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gerar lote enxuto
        run: node scripts/preparar-lote-redacao.mjs
      - name: Publicar lote
        shell: bash
        run: |
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lote-redacao.json
          if git diff --cached --quiet; then
            echo "Lote sem alterações."
            exit 0
          fi
          git commit -m "motor: prepara lote da redação automática"
          git pull --rebase origin main
          git push origin main
