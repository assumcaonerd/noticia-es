name: Preparar lote da redação automática

on:
  schedule:
    # UTC. Coletor roda em :17. A redação fecha o ciclo 30 minutos depois.
    - cron: '47 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/preparar-lote-redacao.mjs'
      - 'scripts/reapurar-lote-redacao.mjs'
      - 'scripts/redator-automatico.mjs'
      - '.github/workflows/preparar-lote-redacao.yml'

permissions:
  contents: write

concurrency:
  group: preparar-lote-redacao
  cancel-in-progress: false

jobs:
  redigir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gerar lote enxuto
        run: node scripts/preparar-lote-redacao.mjs
      - name: Reapurar pautas em reportagens completas
        run: node scripts/reapurar-lote-redacao.mjs
      - name: Publicar reportagens reapuradas
        run: node scripts/redator-automatico.mjs
      - name: Gravar lote e matérias
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lote-redacao.json auto-manifest.js publicacoes-pendentes/ auto-redacao-*.js || true
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
            exit 0
          fi
          git commit -m "motor: reapura lote e publica redação automática"

          for tentativa in 1 2 3 4 5; do
            echo "Tentativa de publicação ${tentativa}/5"
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              echo "Lote e redação publicados."
              exit 0
            fi
            if [ "$tentativa" -lt 5 ]; then
              sleep $((tentativa * 2))
            fi
          done

          echo "Falha ao publicar após 5 tentativas."
          exit 1
