name: Preparar lote da redação automática

on:
  schedule:
    # UTC. Coletor roda em :17. A redação fecha o ciclo 30 minutos depois.
    - cron: '47 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/preparar-lote-redacao.mjs'
      - 'scripts/reapurar-lote-redacao.mjs'
      - 'scripts/gerar-capa-lapis.mjs'
      - 'scripts/redator-automatico.mjs'
      - '.github/workflows/preparar-lote-redacao.yml'

permissions:
  contents: write

concurrency:
  group: preparar-lote-redacao
  cancel-in-progress: false

jobs:
  redigir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick fonts-dejavu-core
      - name: Gerar lote enxuto
        run: node scripts/preparar-lote-redacao.mjs
      - name: Reapurar pautas em reportagens completas
        run: node scripts/reapurar-lote-redacao.mjs
      - name: Gerar capas próprias em imagens/lapis
        run: node scripts/gerar-capa-lapis.mjs
      - name: Publicar reportagens que passaram no redator
        shell: bash
        run: |
          set +e
          node scripts/redator-automatico.mjs
          codigo=$?
          set -e
          if [ "$codigo" -eq 0 ]; then
            echo "Redator publicou shard nesta rodada."
          elif [ "$codigo" -eq 4 ] || [ "$codigo" -eq 5 ]; then
            echo "Nenhuma reportagem completa para o portal nesta rodada (código ${codigo})."
          else
            echo "Redator falhou com código ${codigo}."
            exit "$codigo"
          fi
      - name: Gravar caderno, capas e shards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lote-redacao.json publicacoes-pendentes/ imagens/lapis/ auto-manifest.js auto-redacao-*.js || true
          if git diff --cached --quiet; then
            echo "Nada novo para gravar."
            exit 0
          fi
          if ls auto-redacao-*.js >/dev/null 2>&1 && git diff --cached --name-only | grep -q '^auto-redacao-'; then
            msg="motor: publica redação própria com capa a lápis"
          else
            msg="motor: atualiza caderno e capas sem matéria publicável"
          fi
          git commit -m "$msg"

          for tentativa in 1 2 3 4 5; do
            echo "Tentativa de publicação ${tentativa}/5"
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              echo "Ciclo gravado."
              exit 0
            fi
            if [ "$tentativa" -lt 5 ]; then
              sleep $((tentativa * 2))
            fi
          done

          echo "Falha ao gravar após 5 tentativas."
          exit 1
