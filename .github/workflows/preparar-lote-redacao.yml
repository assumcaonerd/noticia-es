name: Preparar lote da redação automática

on:
  workflow_dispatch:
  push:
    paths:
      - 'pautas.json'
      - 'noticias.js'
      - 'editorial*.js'
      - 'auto-redacao-*.js'
      - 'auto-manifest.js'
      - 'opiniao.js'
      - 'fe-sociedade.js'
      - 'scripts/preparar-lote-redacao.mjs'
      - '.github/workflows/preparar-lote-redacao.yml'

permissions:
  contents: write

concurrency:
  group: preparar-lote-redacao
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gerar lote enxuto
        run: node scripts/preparar-lote-redacao.mjs
      - name: Publicar lote
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lote-redacao.json
          if git diff --cached --quiet; then
            echo "Lote sem alterações."
            exit 0
          fi
          git commit -m "motor: prepara lote da redação automática"

          for tentativa in 1 2 3 4 5; do
            echo "Tentativa de publicação ${tentativa}/5"
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Lote publicado com sucesso."
              exit 0
            fi
            if [ "$tentativa" -lt 5 ]; then
              sleep $((tentativa * 2))
            fi
          done

          echo "Falha ao publicar lote após 5 tentativas."
          exit 1
