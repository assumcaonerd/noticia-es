name: Registrar publicações automáticas

on:
  push:
    branches: [main]
    paths:
      - 'publicacoes-pendentes/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registrar-publicacoes-auto-noticia-es
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar base antes do processamento
        run: git pull --rebase origin main

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Processar recibos
        run: node scripts/processar-publicacoes-auto.mjs

      - name: Validar pautas.json
        run: node -e "JSON.parse(require('fs').readFileSync('pautas.json','utf8')); console.log('pautas.json válido')"

      - name: Salvar status das pautas
        shell: bash
        run: |
          if git diff --quiet -- pautas.json publicacoes-pendentes/; then
            echo "Nenhuma pauta para registrar."
            exit 0
          fi
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pautas.json publicacoes-pendentes/
          git commit -m "motor: registra matérias automáticas publicadas"
          git pull --rebase origin main
          git push origin main
