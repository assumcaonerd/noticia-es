name: Corrigir formato da capa IBGE temporário

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/corrigir-capa-ibge-temp.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Converter PNG para JPEG verdadeiro
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -i assets/og/nem-o-ibge-acredita-no-ibge.png -q:v 2 assets/og/nem-o-ibge-acredita-no-ibge.jpg
          file assets/og/nem-o-ibge-acredita-no-ibge.jpg

      - name: Commitar correção e remover arquivos temporários
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og/nem-o-ibge-acredita-no-ibge.jpg
          git rm assets/og/nem-o-ibge-acredita-no-ibge.png
          git rm .github/workflows/corrigir-capa-ibge-temp.yml
          git commit -m "fix: grava capa do IBGE como JPEG válido"
          git pull --rebase -X theirs origin main
          git push origin main
