name: Gerar miniaturas das noticias
on:
  push:
    branches: [main]
    paths:
      - 'auto-manifest.js'
      - 'auto-redacao-*.js'
      - 'scripts/gerar-miniaturas-sociais.cjs'
      - '.github/workflows/miniaturas-sociais.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gerador-miniaturas
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar e publicar miniaturas com tentativas em caso de concorrencia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/gerar-miniaturas-sociais.cjs
            git add m/
            if git diff --cached --quiet; then
              echo "Nenhuma miniatura nova para publicar."
              exit 0
            fi
            git commit -m "fix: publicar miniaturas sociais das materias"
            if git push origin HEAD:main; then
              echo "Miniaturas publicadas com sucesso."
              exit 0
            fi
            echo "Publicacao concorrente detectada; refazendo com a main atualizada (tentativa ${tentativa}/5)."
            sleep $((tentativa * 4))
          done
          echo "Falha ao publicar apos cinco tentativas." >&2
          exit 1
