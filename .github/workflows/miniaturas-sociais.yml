name: Gerar miniaturas das noticias
on:
  push:
    branches: [main]
    paths:
      - 'auto-manifest.js'
      - 'auto-redacao-*.js'
      - 'scripts/gerar-miniaturas-sociais.cjs'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gerador-miniaturas
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/gerar-miniaturas-sociais.cjs
      - name: Commit e publicacao
        run: |
          git add m/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: publicar miniaturas sociais das materias"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
