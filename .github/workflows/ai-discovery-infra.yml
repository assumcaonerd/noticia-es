name: Infraestrutura de descoberta por IA

on:
  schedule:
    # Regera o sitemap de notícias a cada hora e expira itens com mais de 48 horas.
    - cron: '43 * * * *'
  push:
    branches: [main]
    paths:
      - 'auto-redacao-*.js'
      - 'noticias.js'
      - 'editorial*.js'
      - 'opiniao.js'
      - 'fe-sociedade.js'
      - 'manual-*.js'
      - 'm/**'
      - 'robots.txt'
      - 'scripts/gerar-paginas-og.mjs'
      - 'scripts/reposicionar-aeo.mjs'
      - 'scripts/enriquecer-ai-schema.mjs'
      - 'scripts/gerar-sitemap.mjs'
      - 'scripts/gerar-rss-llms.mjs'
      - 'scripts/notificar-indexnow.mjs'
      - 'scripts/validar-cards-sociais.mjs'
      - '.github/workflows/ai-discovery-infra.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-discovery-noticia-es
  cancel-in-progress: true

jobs:
  discovery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar ImageMagick para gerar capas OG
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Validar scripts
        run: |
          node --check scripts/gerar-paginas-og.mjs
          node --check scripts/reposicionar-aeo.mjs
          node --check scripts/enriquecer-ai-schema.mjs
          node --check scripts/gerar-sitemap.mjs
          node --check scripts/gerar-rss-llms.mjs
          node --check scripts/notificar-indexnow.mjs
          node --check scripts/validar-cards-sociais.mjs

      - name: Atualizar infraestrutura de descoberta
        run: |
          node scripts/gerar-paginas-og.mjs
          node scripts/reposicionar-aeo.mjs
          node scripts/enriquecer-ai-schema.mjs
          node scripts/gerar-sitemap.mjs
          node scripts/gerar-rss-llms.mjs
          node scripts/validar-cards-sociais.mjs

      - name: Salvar arquivos gerados
        shell: bash
        run: |
          git config user.name "Notícia ES Discovery Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Regera os mesmos artefatos sobre o HEAD remoto mais recente quando
          # outra automacao publicar paginas simultaneamente. Nao faz force-push.
          for tentativa in 1 2 3 4; do
            git add m/ sitemap.xml sitemap-news.xml rss.xml llms.txt
            if git diff --cached --quiet; then
              echo "Sem novos arquivos para publicar."
              exit 0
            fi

            git commit -m "seo(ai): atualiza páginas, feeds e dados estruturados"
            if git push origin HEAD:main; then
              echo "Arquivos publicados com sucesso."
              exit 0
            fi

            if [ "$tentativa" -eq 4 ]; then
              echo "Falha ao publicar depois de 4 tentativas."
              exit 1
            fi

            echo "Publicacao concorrente detectada. Sincronizando e regenerando artefatos (tentativa ${tentativa}/4)."
            git fetch origin main
            # Este runner e descartavel. Os artefatos gerados localmente sao
            # reconstruidos a partir do codigo e conteudo mais novos da main.
            git reset --hard origin/main
            node scripts/gerar-paginas-og.mjs
            node scripts/reposicionar-aeo.mjs
            node scripts/enriquecer-ai-schema.mjs
            node scripts/gerar-sitemap.mjs
            node scripts/gerar-rss-llms.mjs
            node scripts/validar-cards-sociais.mjs
            sleep 3
          done

      - name: Notificar IndexNow
        run: node scripts/notificar-indexnow.mjs
