name: Corrigir última imagem Folha Moraes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-ultima-imagem-folha-moraes.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar imagem
        run: python -m pip install --quiet pillow
      - name: Corrigir apenas a última ocorrência
        shell: python
        run: |
          from pathlib import Path
          p=Path('auto-redacao-20260905-154500.js')
          s=p.read_text(encoding='utf-8')
          old='<figure><img src="imagens/folha-moraes-evangelicos-02.jpg" alt="Se eu tiver que voltar para a prisão, que seja como da outra vez: por falar a verdade: Moraes não passa de um LADRÃO!" loading="lazy" data-origem="https://ibb.co/q3g4Q0Mm"><figcaption>“Se eu tiver que voltar para a prisão, que seja como da outra vez: por falar a verdade: Moraes não passa de um LADRÃO!”</figcaption></figure>'
          assert s.count(old)==2, f'esperadas 2 ocorrências, encontradas {s.count(old)}'
          new='<figure><img src="imagens/folha-moraes-evangelicos-08.jpg" alt="Se eu tiver que voltar para a prisão, que seja como da outra vez: por falar a verdade: Moraes não passa de um LADRÃO!" loading="lazy" data-origem="https://ibb.co/ycp3jwMp"><figcaption>“Se eu tiver que voltar para a prisão, que seja como da outra vez: por falar a verdade: Moraes não passa de um LADRÃO!”</figcaption></figure>'
          head, sep, tail = s.rpartition(old)
          assert sep, 'última ocorrência não encontrada'
          s=head+new+tail
          p.write_text(s,encoding='utf-8')
      - name: Baixar a imagem correta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p imagens /tmp/nes-img
          curl --fail --location --retry 4 --user-agent 'Mozilla/5.0' 'https://ibb.co/ycp3jwMp' -o /tmp/nes-img/page.html
          python - <<'PY'
          import html,re
          from pathlib import Path
          s=Path('/tmp/nes-img/page.html').read_text(encoding='utf-8',errors='ignore')
          for pat in [r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']']:
              m=re.search(pat,s,re.I)
              if m:
                  Path('/tmp/nes-img/direct.txt').write_text(html.unescape(m.group(1)),encoding='utf-8');break
          else: raise SystemExit('og:image não encontrado')
          PY
          DIRECT="$(cat /tmp/nes-img/direct.txt)"
          curl --fail --location --retry 4 --user-agent 'Mozilla/5.0' "$DIRECT" -o /tmp/nes-img/raw
          python - <<'PY'
          from PIL import Image,ImageOps
          im=Image.open('/tmp/nes-img/raw')
          im=ImageOps.exif_transpose(im).convert('RGB')
          im.save('imagens/folha-moraes-evangelicos-08.jpg',format='JPEG',quality=94,optimize=True)
          im.verify() if False else None
          PY
          test -s imagens/folha-moraes-evangelicos-08.jpg
      - name: Regenerar e validar
        shell: bash
        run: |
          set -euo pipefail
          node scripts/gerar-paginas-og.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('m/folha-moraes-evangelicos-capitao-assumcao-multa-ales.html')
          s=p.read_text(encoding='utf-8').replace('src="imagens/folha-moraes-evangelicos-','src="https://noticiaes.com.br/imagens/folha-moraes-evangelicos-')
          p.write_text(s,encoding='utf-8')
          PY
          node scripts/reposicionar-aeo.mjs
          node scripts/enriquecer-ai-schema.mjs
          node scripts/gerar-sitemap.mjs
          node scripts/gerar-rss-llms.mjs
          python - <<'PY'
          from pathlib import Path
          s=Path('m/folha-moraes-evangelicos-capitao-assumcao-multa-ales.html').read_text(encoding='utf-8')
          assert s.count('data-origem="https://ibb.co/q3g4Q0Mm"')==1
          assert s.count('data-origem="https://ibb.co/ycp3jwMp"')==1
          pos_q=s.index('data-origem="https://ibb.co/q3g4Q0Mm"')
          pos_y=s.index('data-origem="https://ibb.co/ycp3jwMp"')
          assert pos_y>pos_q, (pos_q,pos_y)
          assert 'https://noticiaes.com.br/imagens/folha-moraes-evangelicos-08.jpg' in s
          print('OK: última imagem corrigida',pos_q,pos_y)
          PY
      - name: Salvar correção
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Notícia ES Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auto-redacao-20260905-154500.js imagens/folha-moraes-evangelicos-08.jpg m/folha-moraes-evangelicos-capitao-assumcao-multa-ales.html sitemap.xml sitemap-news.xml rss.xml llms.txt
          git commit -m 'fix: corrige última imagem da matéria Folha Moraes'
          git push origin HEAD:main
