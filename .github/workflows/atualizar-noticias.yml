name: Coletor automático de pautas

on:
  schedule:
    # A cada 2 horas, no minuto 17.
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/coletar-pautas.mjs'
      - '.github/workflows/atualizar-noticias.yml'

permissions:
  contents: write

concurrency:
  group: coletor-pautas-noticia-es
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Coletar pautas
        run: node scripts/coletar-pautas.mjs

      - name: Salvar fila editorial
        shell: bash
        run: |
          if git diff --quiet -- pautas.json motor-status.json; then
            echo "Nenhuma novidade para registrar."
            exit 0
          fi

          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pautas.json motor-status.json
          git commit -m "pautas: atualização automática"
          git push
