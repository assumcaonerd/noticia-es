name: Coletor automático de pautas

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletor-pautas-noticia-es
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Registrar matérias já publicadas
        shell: bash
        run: |
          node scripts/marcar-rodada6.mjs
          node scripts/marcar-rodada7.mjs
          node scripts/marcar-rodada8.mjs
          node scripts/finalizar-rodada10.mjs
          node scripts/marcar-rodada11.mjs
          node scripts/marcar-rodada12.mjs
          node scripts/marcar-rodada13.mjs
          node scripts/marcar-rodada14.mjs
          node scripts/marcar-rodada16.mjs
          node scripts/marcar-rodada17.mjs
          node scripts/marcar-rodada18.mjs
          node scripts/marcar-rodada19.mjs

      - name: Validar sintaxe e integridade do coletor
        shell: bash
        run: |
          node --check scripts/coletar-pautas.mjs
          node --check scripts/resolver-imagem.mjs
          node --check scripts/coletar-portais-extra.mjs
          node --check scripts/refinar-fontes-nacionais.mjs
          node --check scripts/coletar-flavio-bolsonaro.mjs
          node --check scripts/coletar-redes-locais.mjs
          node --check scripts/coletar-telegram-es.mjs
          node --check scripts/coletar-ales.mjs
          node --check scripts/coletar-dioes.mjs
          node --check scripts/enriquecer-imagens-pautas.mjs
          node --check scripts/fiscal-imagens.mjs
          node scripts/validar-coletor.mjs

      - name: Coletar pautas, manchetes e imagens originais
        run: |
          node scripts/coletar-pautas.mjs
          node scripts/coletar-portais-extra.mjs
          node scripts/refinar-fontes-nacionais.mjs
          node scripts/coletar-flavio-bolsonaro.mjs
          node scripts/coletar-redes-locais.mjs
          node scripts/coletar-telegram-es.mjs
          node scripts/coletar-ales.mjs
          node scripts/coletar-dioes.mjs
          node scripts/enriquecer-imagens-pautas.mjs
          node scripts/fiscal-imagens.mjs

      - name: Publicar alterações manuais do coletor
        shell: bash
        run: |
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma novidade para registrar."
            exit 0
          fi
          git commit -m "pautas: atualiza fila e imagens do motor"
          git pull --rebase origin main
          git push origin main
