name: Motor automático de notícias

on:
  schedule:
    # A cada 2 horas, no minuto 17, para evitar o pico do início da hora.
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    # Serve para testar automaticamente quando o motor ou o workflow forem alterados.
    # Os commits automáticos em noticias.js não entram aqui e, portanto, não criam loop.
    paths:
      - 'scripts/atualizar-noticias.mjs'
      - '.github/workflows/atualizar-noticias.yml'

permissions:
  contents: write

concurrency:
  group: motor-automatico-noticia-es
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Coletar e preparar notícias
        run: node scripts/atualizar-noticias.mjs

      - name: Publicar alterações
        shell: bash
        run: |
          if git diff --quiet -- noticias.js motor-status.json; then
            echo "Nenhuma novidade para publicar."
            exit 0
          fi

          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.js motor-status.json
          git commit -m "noticias: atualização automática"
          git push
