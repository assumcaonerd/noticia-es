name: Coletor automático de pautas

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/coletar-pautas.mjs'
      - 'scripts/coletar-portais-extra.mjs'
      - 'scripts/enriquecer-imagens-pautas.mjs'
      - 'scripts/resolver-imagem.mjs'
      - 'scripts/marcar-rodada6.mjs'
      - 'scripts/reparar-coletor.mjs'
      - '.github/workflows/atualizar-noticias.yml'

permissions:
  contents: write

concurrency:
  group: coletor-pautas-noticia-es
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reparar coletores e registrar matérias publicadas
        run: |
          node scripts/reparar-coletor.mjs
          node scripts/marcar-rodada6.mjs
      - name: Coletar pautas, manchetes e imagens originais
        run: |
          node scripts/coletar-pautas.mjs
          node scripts/coletar-portais-extra.mjs
          node scripts/enriquecer-imagens-pautas.mjs
      - name: Salvar fila editorial
        shell: bash
        run: |
          if git diff --quiet -- pautas.json motor-status.json scripts/coletar-pautas.mjs scripts/resolver-imagem.mjs; then
            echo "Nenhuma novidade para registrar."
            exit 0
          fi
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pautas.json motor-status.json scripts/coletar-pautas.mjs scripts/resolver-imagem.mjs
          git commit -m "pautas: atualiza fila, imagens e estado de publicação"
          git pull --rebase origin main
          git push origin main
