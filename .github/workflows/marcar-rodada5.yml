name: Marcar pautas rodada 5
on:
  push:
    paths:
      - 'scripts/marcar-rodada5.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  marcar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/marcar-rodada5.mjs
      - name: Salvar pautas
        run: |
          if git diff --quiet -- pautas.json; then exit 0; fi
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pautas.json
          git commit -m "pautas: marca rodada 5 como publicada"
          git pull --rebase origin main
          git push
