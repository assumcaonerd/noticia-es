name: Gerar páginas OG para WhatsApp

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'noticias.js'
      - 'scripts/gerar-paginas-og.mjs'
      - 'scripts/normalizar-paginas-estaticas.mjs'
      - 'scripts/publicar-chatgpt-horario.mjs'
      - 'scripts/corrigir-publicacao-chatgpt.mjs'
      - 'scripts/garantir-padrao-publicacao.mjs'
      - '.github/workflows/gerar-paginas-og.yml'
      - '.github/workflows/publicar-proseg-temp.yml'

permissions:
  contents: write

concurrency:
  group: gerar-og-noticia-es
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gerar m/{slug}.html
        run: node scripts/gerar-paginas-og.mjs
      - name: Normalizar metadados e compartilhamento
        run: node scripts/normalizar-paginas-estaticas.mjs
      - name: Gerar sitemaps
        run: node scripts/gerar-sitemap.mjs
      - name: Publicar páginas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m sitemap.xml sitemap-news.xml
          if git diff --cached --quiet; then
            echo "Nenhuma página estática nova."
            exit 0
          fi
          git commit -m "seo: atualiza páginas estáticas e compartilhamento"
          git pull --rebase origin main
          git push origin main
