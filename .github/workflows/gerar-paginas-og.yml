name: Gerar páginas OG para WhatsApp

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-og-noticia-es
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gerar m/{slug}.html
        run: node scripts/gerar-paginas-og.mjs
      - name: Gerar sitemaps
        run: node scripts/gerar-sitemap.mjs
      - name: Publicar páginas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m sitemap.xml sitemap-news.xml
          if git diff --cached --quiet; then
            echo "Nenhuma página estática nova."
            exit 0
          fi
          git commit -m "seo: gera páginas estáticas e sitemaps"
          git pull --rebase origin main
          git push origin main
