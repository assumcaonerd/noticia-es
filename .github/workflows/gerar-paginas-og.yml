name: Gerar páginas OG para WhatsApp

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'noticias.js'
      - 'scripts/gerar-paginas-og.mjs'
      - 'scripts/publicar-chatgpt-horario.mjs'
      - 'scripts/corrigir-publicacao-chatgpt.mjs'
      - 'scripts/garantir-padrao-publicacao.mjs'
      - '.github/workflows/gerar-paginas-og.yml'
      - '.github/workflows/publicar-proseg-temp.yml'

permissions:
  contents: write

concurrency:
  group: gerar-og-noticia-es
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Aplicar matéria PROSEG preparada pelo ChatGPT
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          y = Path('.github/workflows/publicar-proseg-temp.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i,l in enumerate(y) if l.strip() == '- name: Inserir exatamente uma matéria')
          run = next(i for i in range(start+1, len(y)) if y[i].strip() == 'run: |')
          end = next(i for i in range(run+1, len(y)) if y[i].startswith('      - name:'))
          code = '\n'.join((l[10:] if l.startswith('          ') else l) for l in y[run+1:end])
          exec(compile(code, '<publicacao-proseg>', 'exec'))
          PY
      - name: Garantir padrão obrigatório de publicação
        run: |
          node --check scripts/garantir-padrao-publicacao.mjs
          node scripts/garantir-padrao-publicacao.mjs
      - name: Gerar m/{slug}.html
        run: node scripts/gerar-paginas-og.mjs
      - name: Gerar sitemaps
        run: node scripts/gerar-sitemap.mjs
      - name: Publicar páginas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.js m sitemap.xml sitemap-news.xml
          if git diff --cached --quiet; then
            echo "Nenhuma página estática nova."
            exit 0
          fi
          git commit -m "seo: publica matéria ChatGPT e atualiza páginas"
          git pull --rebase origin main
          git push origin main
