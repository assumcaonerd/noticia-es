name: Gerar páginas OG para WhatsApp

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'noticias.js'
      - 'scripts/gerar-paginas-og.mjs'
      - 'scripts/publicar-chatgpt-horario.mjs'
      - 'scripts/corrigir-publicacao-chatgpt.mjs'
      - 'scripts/garantir-padrao-publicacao.mjs'
      - '.github/workflows/gerar-paginas-og.yml'
      - '.github/workflows/publicar-proseg-temp.yml'

permissions:
  contents: write

concurrency:
  group: gerar-og-noticia-es
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Hospedar no Notícia ES a imagem da matéria de Gilvan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p imagens/og
          curl --fail --location --retry 3 --user-agent "NoticiaESBot/1.0" \
            "https://i.ibb.co/SwKbchsN/Chat-GPT-Image-10-de-set-de-2026-09-23-04.png" \
            --output "imagens/og/bastidor-gilvan-paulinho-toffoli.png"
          python3 - <<'PY'
          from pathlib import Path
          arquivo = Path("noticias.js")
          texto = arquivo.read_text(encoding="utf-8")
          texto = texto.replace(
              "https://i.ibb.co/SwKbchsN/Chat-GPT-Image-10-de-set-de-2026-09-23-04.png",
              "/imagens/og/bastidor-gilvan-paulinho-toffoli.png"
          )
          arquivo.write_text(texto, encoding="utf-8")
          PY
      - name: Gerar m/{slug}.html
        run: node scripts/gerar-paginas-og.mjs
      - name: Gerar sitemaps
        run: node scripts/gerar-sitemap.mjs
      - name: Publicar páginas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.js m imagens/og sitemap.xml sitemap-news.xml
          if git diff --cached --quiet; then
            echo "Nenhuma página estática nova."
            exit 0
          fi
          git commit -m "seo: publica matéria ChatGPT e atualiza páginas"
          git pull --rebase origin main
          git push origin main
