name: Gerar páginas OG para WhatsApp

on:
  workflow_dispatch:
  # GitHub Actions não dispara workflows de push para commits do GITHUB_TOKEN.
  # Regerar páginas após o fechamento da redação, inclusive commits do bot.
  workflow_run:
    workflows: ['Preparar lote da redação automática']
    types: [completed]
  push:
    branches:
      - main
    paths:
      - 'noticias.js'
      - 'editorial-*.js'
      - 'auto-redacao-*.js'
      - 'auto-manifest.js'
      - 'capa-completa.html'
      - 'opiniao.js'
      - 'fe-sociedade*.js'
      - 'manual-*.js'
      - 'gilvan-foto-*.js'
      - 'skin/**'
      - '*-fix*.js'
      - 'destaque-manual.js'
      - 'imagens-fonte.js'
      - 'imagem-policy.js'
      - 'fontes-sem-link.js'
      - 'scripts/gerar-indice-noticias.mjs'
      - 'scripts/gerar-paginas-og.mjs'
      - 'scripts/normalizar-paginas-estaticas.mjs'
      - 'scripts/publicar-chatgpt-horario.mjs'
      - 'scripts/corrigir-publicacao-chatgpt.mjs'
      - 'scripts/garantir-padrao-publicacao.mjs'
      - 'scripts/consertar-cabecalho-noticias.mjs'
      - 'scripts/validar-cards-sociais.mjs'
      - '.github/workflows/gerar-paginas-og.yml'
      - '.github/workflows/publicar-proseg-temp.yml'

permissions:
  contents: write

concurrency:
  # Mesma fila das outras rotinas que regeneram m/, sitemap e RSS
  # (ai-discovery-infra.yml e miniaturas-sociais.yml): nunca rodam juntas.
  group: noticia-es-paginas
  cancel-in-progress: false

jobs:
  gerar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar ImageMagick para capas a lápis
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Hospedar capa OG de O calhorda tem nome no Notícia ES
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/og
          if [ ! -s 'assets/og/o-calhorda-tem-nome.png' ]; then
            curl --http1.1 -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 \
              'https://i.ibb.co/N6qRWTmp/Chat-GPT-Image-10-de-set-de-2026-21-41-45.png' \
              -o 'assets/og/o-calhorda-tem-nome.png'
          else
            echo "Capa OG versionada já presente: assets/og/o-calhorda-tem-nome.png"
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('editorial-37.js')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace(
                  'https://i.ibb.co/N6qRWTmp/Chat-GPT-Image-10-de-set-de-2026-21-41-45.png',
                  'https://noticiaes.com.br/assets/og/o-calhorda-tem-nome.png'
              )
              p.write_text(s, encoding='utf-8')
          PY

      - name: Hospedar capa OG da matéria sobre ICL e INSS no Notícia ES
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/og
          if [ ! -s 'assets/og/mesma-sala-mesmo-crime-icl-inss.png' ]; then
            curl --http1.1 -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 \
              'https://i.ibb.co/R44BNMW6/Chat-GPT-Image-12-de-set-de-2026-11-36-53.png' \
              -o 'assets/og/mesma-sala-mesmo-crime-icl-inss.png'
          else
            echo "Capa OG versionada já presente: assets/og/mesma-sala-mesmo-crime-icl-inss.png"
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('editorial-39.js')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace(
                  'https://i.ibb.co/R44BNMW6/Chat-GPT-Image-12-de-set-de-2026-11-36-53.png',
                  'https://noticiaes.com.br/assets/og/mesma-sala-mesmo-crime-icl-inss.png'
              )
              p.write_text(s, encoding='utf-8')
          PY

      - name: Hospedar capa OG da matéria sobre Folha, Flávio e caso Master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/og
          if [ ! -s 'assets/og/folha-flavio-moraes-vorcaro-lula.png' ]; then
            curl --http1.1 -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 \
              'https://i.ibb.co/S73zCTrX/Chat-GPT-Image-12-de-set-de-2026-16-13-45.png' \
              -o 'assets/og/folha-flavio-moraes-vorcaro-lula.png'
          else
            echo "Capa OG versionada já presente: assets/og/folha-flavio-moraes-vorcaro-lula.png"
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('editorial-41.js')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace(
                  'https://i.ibb.co/S73zCTrX/Chat-GPT-Image-12-de-set-de-2026-16-13-45.png',
                  'https://noticiaes.com.br/assets/og/folha-flavio-moraes-vorcaro-lula.png'
              )
              p.write_text(s, encoding='utf-8')
          PY

      - name: Hospedar capa OG da matéria sobre Mendonça e a Presidência do STF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/og
          if [ ! -s 'assets/og/mendonca-presidencia-stf-investigacao-moraes.png' ]; then
            curl --http1.1 -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 \
              'https://i.ibb.co/20yFLpc0/690-C0857-DCD1-422-A-9-D9-D-60-E437-E1653-A.png' \
              -o 'assets/og/mendonca-presidencia-stf-investigacao-moraes.png'
          else
            echo "Capa OG versionada já presente: assets/og/mendonca-presidencia-stf-investigacao-moraes.png"
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('editorial-42.js')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace(
                  'https://i.ibb.co/20yFLpc0/690-C0857-DCD1-422-A-9-D9-D-60-E437-E1653-A.png',
                  'https://noticiaes.com.br/assets/og/mendonca-presidencia-stf-investigacao-moraes.png'
              )
              p.write_text(s, encoding='utf-8')
          PY

      - name: Consertar cabeçalho de noticias.js
        run: node scripts/consertar-cabecalho-noticias.mjs
      - name: Validar padrão editorial antes de gerar páginas
        run: node scripts/garantir-padrao-publicacao.mjs
      - name: Gerar m/{slug}.html
        run: node scripts/gerar-paginas-og.mjs
      - name: Normalizar metadados e compartilhamento
        run: node scripts/normalizar-paginas-estaticas.mjs
      - name: Bloquear publicação com miniatura inválida
        run: node scripts/validar-cards-sociais.mjs
      - name: Gerar sitemaps
        run: node scripts/gerar-sitemap.mjs
      - name: Gerar RSS e llms.txt
        run: node scripts/gerar-rss-llms.mjs
      - name: Gerar índice da capa leve
        # Falha aqui não pode travar páginas, sitemap e RSS: o índice anterior continua valendo.
        run: node scripts/gerar-indice-noticias.mjs || echo "::warning::Índice da capa não foi regenerado."
      - name: Publicar páginas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m imagens/lapis sitemap.xml sitemap-news.xml rss.xml llms.txt assets/og editorial-37.js editorial-39.js editorial-41.js editorial-42.js scripts/validar-cards-sociais.mjs noticias.js indice-capa.json indice-noticias.json
          if git diff --cached --quiet; then
            echo "Nenhuma página estática nova."
            exit 0
          fi
          git commit -m "seo: hospeda capas OG, conserta noticias.js e atualiza páginas"
          # Outras rotinas publicam na main ao mesmo tempo. Sem conflito, o rebase
          # simples basta. Com conflito, NÃO impomos a versão desta execução
          # (o antigo "-X theirs" sobrescrevia correções feitas por outras rotinas):
          # descartamos o commit local e regeneramos tudo a partir da main atual.
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "Páginas OG publicadas na tentativa $tentativa."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$tentativa" -eq 5 ]; then
              echo "::error::Não foi possível publicar após cinco tentativas."
              exit 1
            fi
            echo "::warning::A branch main mudou durante a publicação; regenerando a partir dela (tentativa $tentativa de 5)."
            sleep "$((tentativa * 2))"
            git fetch origin main
            git reset --hard origin/main
            node scripts/consertar-cabecalho-noticias.mjs
            node scripts/garantir-padrao-publicacao.mjs
            node scripts/gerar-paginas-og.mjs
            node scripts/normalizar-paginas-estaticas.mjs
            node scripts/validar-cards-sociais.mjs
            node scripts/gerar-sitemap.mjs
            node scripts/gerar-rss-llms.mjs
            node scripts/gerar-indice-noticias.mjs || echo "::warning::Índice da capa não foi regenerado."
            git add m imagens/lapis sitemap.xml sitemap-news.xml rss.xml llms.txt assets/og editorial-37.js editorial-39.js editorial-41.js editorial-42.js scripts/validar-cards-sociais.mjs noticias.js indice-capa.json indice-noticias.json
            if git diff --cached --quiet; then
              echo "Nada novo a publicar depois de sincronizar com a main."
              exit 0
            fi
            git commit -m "seo: hospeda capas OG, conserta noticias.js e atualiza páginas"
          done

# trigger-capas-lapis-6
