name: Gerar páginas OG para WhatsApp

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'noticias.js'
      - 'editorial-*.js'
      - 'scripts/gerar-paginas-og.mjs'
      - 'scripts/normalizar-paginas-estaticas.mjs'
      - 'scripts/publicar-chatgpt-horario.mjs'
      - 'scripts/corrigir-publicacao-chatgpt.mjs'
      - 'scripts/garantir-padrao-publicacao.mjs'
      - '.github/workflows/gerar-paginas-og.yml'
      - '.github/workflows/publicar-proseg-temp.yml'

permissions:
  contents: write

concurrency:
  group: gerar-og-noticia-es
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Hospedar capa OG de O calhorda tem nome no Notícia ES
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/og
          curl -fL --retry 3 --retry-delay 2 \
            'https://i.ibb.co/N6qRWTmp/Chat-GPT-Image-10-de-set-de-2026-21-41-45.png' \
            -o 'assets/og/o-calhorda-tem-nome.png'
          python - <<'PY'
          from pathlib import Path
          p = Path('editorial-37.js')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace(
                  'https://i.ibb.co/N6qRWTmp/Chat-GPT-Image-10-de-set-de-2026-21-41-45.png',
                  'https://noticiaes.com.br/assets/og/o-calhorda-tem-nome.png'
              )
              p.write_text(s, encoding='utf-8')
          PY

      - name: Hospedar capa OG da matéria sobre ICL e INSS no Notícia ES
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/og
          curl -fL --retry 3 --retry-delay 2 \
            'https://i.ibb.co/R44BNMW6/Chat-GPT-Image-12-de-set-de-2026-11-36-53.png' \
            -o 'assets/og/mesma-sala-mesmo-crime-icl-inss.png'
          python - <<'PY'
          from pathlib import Path
          p = Path('editorial-39.js')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace(
                  'https://i.ibb.co/R44BNMW6/Chat-GPT-Image-12-de-set-de-2026-11-36-53.png',
                  'https://noticiaes.com.br/assets/og/mesma-sala-mesmo-crime-icl-inss.png'
              )
              p.write_text(s, encoding='utf-8')
          PY

      - name: Hospedar capa OG da matéria sobre Folha, Flávio e caso Master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/og
          curl -fL --retry 3 --retry-delay 2 \
            'https://i.ibb.co/S73zCTrX/Chat-GPT-Image-12-de-set-de-2026-16-13-45.png' \
            -o 'assets/og/folha-flavio-moraes-vorcaro-lula.png'
          python - <<'PY'
          from pathlib import Path
          p = Path('editorial-41.js')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace(
                  'https://i.ibb.co/S73zCTrX/Chat-GPT-Image-12-de-set-de-2026-16-13-45.png',
                  'https://noticiaes.com.br/assets/og/folha-flavio-moraes-vorcaro-lula.png'
              )
              p.write_text(s, encoding='utf-8')
          PY

      - name: Gerar m/{slug}.html
        run: node scripts/gerar-paginas-og.mjs
      - name: Normalizar metadados e compartilhamento
        run: node scripts/normalizar-paginas-estaticas.mjs
      - name: Gerar sitemaps
        run: node scripts/gerar-sitemap.mjs
      - name: Publicar páginas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m sitemap.xml sitemap-news.xml assets/og editorial-37.js editorial-39.js editorial-41.js
          if git diff --cached --quiet; then
            echo "Nenhuma página estática nova."
            exit 0
          fi
          git commit -m "seo: hospeda capas OG e atualiza páginas"
          git pull --rebase -X theirs origin main
          git push origin main
