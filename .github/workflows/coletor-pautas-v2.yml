name: Coletor de pautas v2

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/coletar-pautas.mjs'
      - 'scripts/resolver-imagem.mjs'
      - 'scripts/enriquecer-imagens-pautas.mjs'
      - '.github/workflows/coletor-pautas-v2.yml'

permissions:
  contents: write

concurrency:
  group: coletor-pautas-v2
  cancel-in-progress: true

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar coletor principal
        run: |
          node --check scripts/coletar-pautas.mjs
          node --check scripts/resolver-imagem.mjs
      - name: Coletar pautas novas
        run: node scripts/coletar-pautas.mjs
      - name: Enriquecer imagens
        continue-on-error: true
        run: node scripts/enriquecer-imagens-pautas.mjs
      - name: Gravar fila
        shell: bash
        run: |
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pautas.json motor-status.json
          if [ -f imagens-fonte.js ]; then git add imagens-fonte.js; fi
          if git diff --cached --quiet; then
            echo "Nenhuma pauta nova ou alteração de status."
            exit 0
          fi
          git commit -m "pautas: coleta v2 atualiza fila editorial"
          git pull --rebase origin main
          git push origin main
