name: Preparar Google Analytics no Notícia ES

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instalar-google-analytics.yml'
      - 'scripts/preparar-google-analytics.mjs'

permissions:
  contents: write

concurrency:
  group: preparar-google-analytics-noticia-es
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validar instalador
        run: node --check scripts/preparar-google-analytics.mjs

      - name: Preparar páginas públicas e gerador
        run: node scripts/preparar-google-analytics.mjs

      - name: Registrar integração
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scripts/gerar-paginas-og.mjs
          git add ./*.html
          git add m

          if git diff --cached --quiet; then
            echo "Google Analytics já está preparado em todas as páginas públicas."
            exit 0
          fi

          git commit -m "analytics: prepara páginas públicas para GA4"
          git pull --rebase origin main
          git push origin main
