name: Regenerar capas a lápis

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerar-capas-lapis
  cancel-in-progress: false

jobs:
  regenerar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Redesenhar capas a partir da foto original
        run: node scripts/regenerar-capas-lapis.mjs
      - name: Gravar capas no padrão único
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens/lapis
          if git diff --cached --quiet; then
            echo "Nenhuma capa nova."
            exit 0
          fi
          git commit -m "capas: grafite fiel à foto original, padrão único"
          for tentativa in 1 2 3 4 5; do
            echo "Tentativa de publicação ${tentativa}/5"
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              echo "Capas gravadas."
              exit 0
            fi
            sleep $((tentativa * 2))
          done
          echo "Falha ao gravar após 5 tentativas."
          exit 1
