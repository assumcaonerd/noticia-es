name: Marcar pautas rodada 3
on:
  push:
    paths:
      - 'scripts/marcar-rodada3.mjs'
      - '.github/workflows/marcar-rodada3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  marcar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/marcar-rodada3.mjs
      - run: |
          if git diff --quiet -- pautas.json; then exit 0; fi
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pautas.json
          git commit -m "pautas: marca rodada editorial 3 como publicada"
          git pull --rebase
          git push
