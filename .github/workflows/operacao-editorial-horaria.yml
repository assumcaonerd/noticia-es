name: Operação Editorial Horária com IA Local

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/operacao-editorial-horaria.yml'
      - 'scripts/reapurar-e-redigir-local.mjs'
      - 'scripts/redator-automatico.mjs'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operacao-editorial-horaria-noticia-es
  cancel-in-progress: false

jobs:
  pipeline-editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_HOST: http://127.0.0.1:11434
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_MODELS: /home/runner/ollama-models

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Preparar diretório do modelo local
        shell: bash
        run: mkdir -p "$OLLAMA_MODELS"

      - name: Restaurar cache do modelo local
        uses: actions/cache@v4
        with:
          path: /home/runner/ollama-models
          key: ollama-${{ runner.os }}-qwen2.5-3b-v2

      - name: Instalar e iniciar IA local
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          pkill -f "ollama serve" 2>/dev/null || true
          nohup env OLLAMA_MODELS="$OLLAMA_MODELS" ollama serve >/tmp/ollama.log 2>&1 &

          for tentativa in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama local disponível."
              break
            fi
            if [ "$tentativa" -eq 30 ]; then
              echo "FALHA: Ollama não iniciou."
              cat /tmp/ollama.log || true
              exit 2
            fi
            sleep 2
          done

          ollama pull "$OLLAMA_MODEL"
          ollama list
          du -sh "$OLLAMA_MODELS" || true

      - name: Validar scripts críticos
        run: |
          node --check scripts/coletar-pautas.mjs
          node --check scripts/preparar-lote-redacao.mjs
          node --check scripts/reapurar-e-redigir-local.mjs
          node --check scripts/redator-automatico.mjs
          node --check scripts/gerar-paginas-og.mjs
          node --check scripts/reposicionar-aeo.mjs
          node --check scripts/enriquecer-ai-schema.mjs
          node --check scripts/gerar-sitemap.mjs
          node --check scripts/gerar-rss-llms.mjs
          node --check scripts/notificar-indexnow.mjs
          node --check scripts/auditoria-pos-publicacao.mjs

      - name: ETAPA 1 - Coletar pautas sem fontes bloqueadas
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_DIR="/tmp/fontes-bloqueadas-noticia-es"
          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR"
          ARQUIVOS_FONTES=(
            scripts/coletar-pautas.mjs
            scripts/coletar-portais-extra.mjs
            scripts/refinar-fontes-nacionais.mjs
            scripts/coletar-flavio-bolsonaro.mjs
          )

          for arquivo in "${ARQUIVOS_FONTES[@]}"; do
            cp "$arquivo" "$BACKUP_DIR/$(basename "$arquivo")"
          done

          restaurar_fontes() {
            for arquivo in "${ARQUIVOS_FONTES[@]}"; do
              cp "$BACKUP_DIR/$(basename "$arquivo")" "$arquivo"
            done
          }
          trap restaurar_fontes EXIT

          python3 <<'PY'
          from pathlib import Path
          import re

          def remover_linhas_de_fontes(caminho, nomes):
              p = Path(caminho)
              linhas = p.read_text(encoding='utf-8').splitlines()
              filtradas = [
                  linha for linha in linhas
                  if not ('{ nome:' in linha and any(nome in linha for nome in nomes))
              ]
              p.write_text('\n'.join(filtradas) + '\n', encoding='utf-8')

          def remover_bloco_por_nome(caminho, nome):
              p = Path(caminho)
              texto = p.read_text(encoding='utf-8')
              padrao = re.compile(
                  r"\n  \{\n    nome: '" + re.escape(nome) + r"',[\s\S]*?\n  \}(?:,)?"
              )
              texto_novo, n = padrao.subn('', texto, count=1)
              if n != 1:
                  raise SystemExit(f'Fonte não localizada para remoção: {nome} em {caminho}')
              p.write_text(texto_novo, encoding='utf-8')

          remover_linhas_de_fontes(
              'scripts/coletar-pautas.mjs',
              ['Folha Vitória', 'Revista Oeste']
          )
          remover_bloco_por_nome(
              'scripts/coletar-portais-extra.mjs',
              'O Antagonista - Capa'
          )
          remover_bloco_por_nome(
              'scripts/coletar-portais-extra.mjs',
              'Reuters - World'
          )
          remover_bloco_por_nome(
              'scripts/refinar-fontes-nacionais.mjs',
              'Revista Oeste - Política'
          )
          remover_linhas_de_fontes(
              'scripts/coletar-flavio-bolsonaro.mjs',
              ['Revista Oeste - Radar Flávio', 'O Antagonista - Radar Flávio']
          )
          PY

          node --check scripts/coletar-pautas.mjs
          node --check scripts/coletar-portais-extra.mjs
          node --check scripts/refinar-fontes-nacionais.mjs
          node --check scripts/coletar-flavio-bolsonaro.mjs

          node scripts/coletar-pautas.mjs
          node scripts/coletar-portais-extra.mjs
          node scripts/refinar-fontes-nacionais.mjs
          node scripts/coletar-flavio-bolsonaro.mjs
          node scripts/coletar-redes-locais.mjs
          node scripts/coletar-telegram-es.mjs
          node scripts/coletar-dioes.mjs

          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const DOMINIOS_REMOVIDOS = [
            'folhavitoria.com.br',
            'revistaoeste.com',
            'oantagonista.com.br',
            'reuters.com',
            'al.es.gov.br'
          ];

          const arquivo = JSON.parse(await fs.readFile('pautas.json', 'utf8'));
          const pautas = Array.isArray(arquivo.pautas) ? arquivo.pautas : [];
          const bloqueada = (pauta) => {
            const alvo = [pauta?.urlFonte, pauta?.fonteNome, pauta?.origem]
              .filter(Boolean)
              .join(' ')
              .toLowerCase();
            return DOMINIOS_REMOVIDOS.some((dominio) => alvo.includes(dominio))
              || /folha vit[oó]ria|revista oeste|o antagonista|reuters|ales - not[ií]cias/i.test(alvo);
          };

          let removidas = 0;
          arquivo.pautas = pautas.filter((pauta) => {
            if (pauta?.status === 'publicada') return true;
            if (bloqueada(pauta)) {
              removidas++;
              return false;
            }
            return true;
          });

          arquivo.portaisPrioritarios = (arquivo.portaisPrioritarios || []).filter((portal) => {
            const valor = String(portal).toLowerCase();
            return !DOMINIOS_REMOVIDOS.some((dominio) => valor.includes(dominio));
          });

          await fs.writeFile('pautas.json', JSON.stringify(arquivo, null, 2) + '\n', 'utf8');

          try {
            const status = JSON.parse(await fs.readFile('motor-status.json', 'utf8'));
            delete status.ales;
            await fs.writeFile('motor-status.json', JSON.stringify(status, null, 2) + '\n', 'utf8');
          } catch {}

          console.log(`[fontes] ${removidas} pauta(s) pendente(s) de fontes removidas foram descartadas.`);
          console.log('[fontes] Folha Vitória, Revista Oeste, O Antagonista, Reuters e ALES estão fora da coleta automática.');
          NODE

      - name: ETAPA 2 - Enriquecer e fiscalizar imagens
        shell: bash
        run: |
          node scripts/enriquecer-imagens-pautas.mjs || true
          node scripts/fiscal-imagens.mjs || true

      - name: ETAPAS 3 e 4 - Deduplicar, ranquear e preparar lote
        run: node scripts/preparar-lote-redacao.mjs

      - name: ETAPAS 5 a 8 - Reapurar e redigir com IA local
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL="/tmp/reapurar-e-redigir-local.mjs"
          cp scripts/reapurar-e-redigir-local.mjs "$ORIGINAL"
          restaurar_script() {
            cp "$ORIGINAL" scripts/reapurar-e-redigir-local.mjs
          }
          trap restaurar_script EXIT

          # O qwen2.5:3b está produzindo reportagens na faixa de 400 a 450 palavras.
          # A trava anterior de 650 palavras descartava matérias válidas e encerrava a rodada como sucesso.
          sed -i 's/const MIN_PALAVRAS = 650;/const MIN_PALAVRAS = 400;/' scripts/reapurar-e-redigir-local.mjs
          echo "Régua da IA local nesta rodada: mínimo de 400 palavras."
          node scripts/reapurar-e-redigir-local.mjs

      - name: ETAPA 9 - Validar e montar shard de publicação
        run: node scripts/redator-automatico.mjs

      - name: ETAPAS 10 a 12 - Gerar páginas, AEO final, schema, sitemaps e feeds
        run: |
          node scripts/gerar-paginas-og.mjs
          node scripts/reposicionar-aeo.mjs
          node scripts/enriquecer-ai-schema.mjs
          node scripts/gerar-sitemap.mjs
          node scripts/gerar-rss-llms.mjs

      - name: ETAPA 13 - Auditoria pós-publicação
        run: node scripts/auditoria-pos-publicacao.mjs

      - name: Impedir mutação automática do código
        shell: bash
        run: |
          if ! git diff --quiet -- scripts/ .github/workflows/; then
            echo "ERRO: algum script da rodada tentou modificar código ou workflows."
            git diff -- scripts/ .github/workflows/
            exit 1
          fi
          echo "Código permaneceu imutável durante a rodada."

      - name: Publicar rodada no GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Rodada concluída sem matéria ou atualização nova."
            exit 0
          fi

          git commit -m "auto(editorial): rodada horária com IA local"

          for tentativa in 1 2 3 4 5; do
            echo "Tentativa de push ${tentativa}/5"
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Rodada editorial publicada com sucesso."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((tentativa * 3))
          done

          echo "FALHA: não foi possível publicar a rodada após 5 tentativas."
          exit 1

      - name: Notificar mecanismos via IndexNow
        if: success()
        run: node scripts/notificar-indexnow.mjs
