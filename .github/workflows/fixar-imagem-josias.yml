name: Fixar imagem Pastor Josias

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fixar-imagem-josias.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  espelhar-imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Baixar imagem para o próprio Notícia ES
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p imagens
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'Mozilla/5.0' \
            'https://i.ibb.co/HLGfpLL8/image.png' \
            --output imagens/pastor-josias-junior-59-anos.png
          test -s imagens/pastor-josias-junior-59-anos.png
          file imagens/pastor-josias-junior-59-anos.png

      - name: Trocar origem externa pela imagem local
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('fe-sociedade.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://i.ibb.co/HLGfpLL8/image.png', 'imagens/pastor-josias-junior-59-anos.png')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Regenerar página e descoberta
        run: |
          node scripts/gerar-paginas-og.mjs
          node scripts/reposicionar-aeo.mjs
          node scripts/enriquecer-ai-schema.mjs
          node scripts/gerar-sitemap.mjs
          node scripts/gerar-rss-llms.mjs

      - name: Salvar correção
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Notícia ES Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagens/pastor-josias-junior-59-anos.png fe-sociedade.js m/pastor-josias-junior-59-anos-igreja-crista-maranata.html sitemap.xml sitemap-news.xml rss.xml llms.txt
          if git diff --cached --quiet; then
            echo 'Nada a alterar.'
            exit 0
          fi
          git commit -m 'fix(fe): hospeda imagem do pastor Josias no Notícia ES'
          git push origin HEAD:main
