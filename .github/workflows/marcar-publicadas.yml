name: Marcar pautas publicadas

on:
  push:
    paths:
      - 'scripts/marcar-pautas-publicadas.mjs'
      - '.github/workflows/marcar-publicadas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  marcar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Atualizar pautas
        run: node scripts/marcar-pautas-publicadas.mjs
      - name: Publicar status
        shell: bash
        run: |
          if git diff --quiet -- pautas.json; then
            exit 0
          fi
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pautas.json
          git commit -m "pautas: marca matérias editoriais como publicadas"
          git push
