name: Corrigir imagem Moraes Mendonça

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-imagem-moraes-mendonca.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Baixar exatamente a imagem indicada no ImgBB
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' 'https://ibb.co/Pzz2216X' -o /tmp/ibb.html
          python - <<'PY'
          import html, re
          from pathlib import Path
          s = Path('/tmp/ibb.html').read_text(encoding='utf-8', errors='ignore')
          pats = [
              r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',
              r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']'
          ]
          for p in pats:
              m = re.search(p, s, re.I)
              if m:
                  Path('/tmp/image_url.txt').write_text(html.unescape(m.group(1)), encoding='utf-8')
                  break
          else:
              raise SystemExit('og:image não encontrado na página ImgBB')
          PY
          IMG_URL="$(cat /tmp/image_url.txt)"
          echo "Imagem direta: $IMG_URL"
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' "$IMG_URL" -o /tmp/nova-imagem
          test -s /tmp/nova-imagem
          mkdir -p imagens
          if command -v magick >/dev/null 2>&1; then
            magick /tmp/nova-imagem -quality 94 imagens/moraes-mendonca-vorcaro.jpg
          elif command -v convert >/dev/null 2>&1; then
            convert /tmp/nova-imagem -quality 94 imagens/moraes-mendonca-vorcaro.jpg
          else
            cp /tmp/nova-imagem imagens/moraes-mendonca-vorcaro.jpg
          fi
          test -s imagens/moraes-mendonca-vorcaro.jpg
          file imagens/moraes-mendonca-vorcaro.jpg
      - name: Ajustar somente a legenda da imagem
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('auto-redacao-20260903-235800.js')
          s=p.read_text(encoding='utf-8')
          antigo='legendaImagem: "André Mendonça e Alexandre de Moraes no plenário do STF. Foto: Antonio Augusto/STF",'
          novo='legendaImagem: "André Mendonça e Alexandre de Moraes no plenário do STF.",'
          if antigo not in s:
              raise SystemExit('Legenda anterior não encontrada')
          p.write_text(s.replace(antigo, novo, 1), encoding='utf-8')
          PY
      - name: Regenerar apenas derivados da publicação
        run: |
          node scripts/gerar-paginas-og.mjs
          node scripts/reposicionar-aeo.mjs
          node scripts/enriquecer-ai-schema.mjs
          node scripts/gerar-sitemap.mjs
          node scripts/gerar-rss-llms.mjs
      - name: Salvar correção da imagem
        shell: bash
        run: |
          git config user.name 'Notícia ES Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imagens/moraes-mendonca-vorcaro.jpg auto-redacao-20260903-235800.js m/moraes-inquerito-fake-news-mendonca-vorcaro.html sitemap.xml sitemap-news.xml rss.xml llms.txt
          git commit -m 'fix(img): substitui somente imagem de Moraes e Mendonça'
          git push origin HEAD:main
