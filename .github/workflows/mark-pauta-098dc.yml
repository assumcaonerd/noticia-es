name: Finalizar pauta de saneamento

on:
  push:
    paths:
      - '.github/workflows/mark-pauta-098dc.yml'

permissions:
  contents: write

jobs:
  atualizar-pauta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Marcar pauta publicada
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('pautas.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          alvo = '098dc04bcbea0609'
          encontrado = False
          for pauta in data.get('pautas', []):
              if pauta.get('id') == alvo:
                  pauta['status'] = 'publicada'
                  pauta['slugPublicado'] = 'saneamento-eleicoes-es-universalizacao-2033-ppp-aguas-do-campo'
                  pauta['publicadaEm'] = '2026-08-29T12:26:57.000Z'
                  encontrado = True
                  break
          if not encontrado:
              raise SystemExit('Pauta alvo não encontrada')
          data['atualizadoEm'] = '2026-08-29T12:26:57.000Z'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('.github/workflows/mark-pauta-098dc.yml').unlink()
          PY
      - name: Gravar atualização na main
        run: |
          git config user.name 'noticia-es-bot'
          git config user.email 'noticia-es-bot@users.noreply.github.com'
          git add pautas.json .github/workflows/mark-pauta-098dc.yml
          git commit -m 'Marca pauta de saneamento como publicada'
          git push origin HEAD:main
