name: Redator automático Notícia ES

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Coletor automático de pautas"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: redator-automatico-noticia-es
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validar motor editorial
        run: |
          node --check scripts/preparar-lote-redacao.mjs
          node --check scripts/reapurar-e-redigir.mjs
          node --check scripts/redator-automatico.mjs
          node --check scripts/processar-publicacoes-auto.mjs
          node --check scripts/gerar-paginas-og.mjs
          node --check scripts/normalizar-paginas-estaticas.mjs
          node --check scripts/reposicionar-aeo.mjs
          node --check scripts/enriquecer-ai-schema.mjs
          node --check scripts/gerar-sitemap.mjs
          node --check scripts/gerar-rss-llms.mjs
          node --check scripts/validar-cards-sociais.mjs
          node --check scripts/auditoria-pos-publicacao.mjs

      - name: Preparar fila atual da redação
        run: node scripts/preparar-lote-redacao.mjs

      - name: Reapurar e redigir uma reportagem
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
        run: node scripts/reapurar-e-redigir.mjs

      - name: Gerar matéria e registrar pauta publicada
        run: |
          node scripts/redator-automatico.mjs
          node scripts/processar-publicacoes-auto.mjs

      - name: Atualizar páginas, miniaturas, SEO e AEO
        run: |
          node scripts/gerar-paginas-og.mjs
          node scripts/normalizar-paginas-estaticas.mjs
          node scripts/reposicionar-aeo.mjs
          node scripts/enriquecer-ai-schema.mjs
          node scripts/gerar-sitemap.mjs
          node scripts/gerar-rss-llms.mjs
          node scripts/validar-cards-sociais.mjs

      - name: Auditar matéria antes da publicação
        run: |
          node scripts/auditoria-pos-publicacao.mjs
          node -e "JSON.parse(require('fs').readFileSync('lote-redacao.json','utf8')); console.log('lote válido')"

      - name: Publicar reportagem e arquivos atualizados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Notícia ES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma matéria nova para publicar."
            exit 0
          fi
          git commit -m "redacao: publica lote automático"
          for tentativa in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((tentativa * 2))
          done
          exit 1

      - name: Notificar mecanismos de busca
        if: success()
        continue-on-error: true
        run: node scripts/notificar-indexnow.mjs
